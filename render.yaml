databases:
  - name: po-extraction-db
    plan: basic-256mb

services:
  - type: web
    name: po-extraction-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: po-extraction-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: EXTRACTION_PROVIDER
        value: claude
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: MAX_PDF_PAGES
        value: "10"
      - key: HEARTBEAT_STALE_SECONDS
        value: "120"
      - key: WORKER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: po-extraction-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
