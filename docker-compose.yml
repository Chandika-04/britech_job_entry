services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: po
      POSTGRES_PASSWORD: po
      POSTGRES_DB: po_extraction
    ports:
      - "5432:5432"
    volumes:
      - po_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po -d po_extraction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  po_pgdata:
